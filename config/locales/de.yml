  text_vacation_messages_info: "Abwesenheiten erscheinen in der Übersicht, als Hinweis beim Zuweisen von Tickets, als Kennzeichen neben dem Namen und – wenn gewünscht – als Banner oben auf jeder Seite. Jeweils nur für die Personen, die du unter „Sichtbarkeit“ auswählst."
  text_vacation_text_info: "z. B. „Sommerurlaub“. Mit „Zeitraum anhängen“ wird das Datum automatisch ergänzt."
  text_vacation_visibility_info: "Gilt für Banner, Übersicht, Zuweisungshinweis und Kennzeichen."
  text_vacation_recipients_info: "Nur bei „Ausgewählte Benutzer und Gruppen“. Mehrfachauswahl mit Strg/Cmd."
  text_vacation_projects_info: "Nur bei „Mitglieder ausgewählter Projekte“. Mehrfachauswahl mit Strg/Cmd."
  text_vacation_show_banner_info: "Ohne Banner bleibt die Abwesenheit trotzdem in Übersicht, Zuweisungshinweis und Kennzeichen sichtbar."
  text_vacation_lead_days_info: "Banner schon so viele Tage vor Beginn anzeigen. 0 = erst ab dem ersten Tag."
  text_vacation_preview_lead_info: "So wird das Banner ab %{date} bis zum Vortag angezeigt."
  text_vacation_allowed_groups_info: "Wer eigene Abwesenheiten pflegen darf. Keine Auswahl bedeutet: alle angemeldeten Benutzer. Administratoren dürfen immer."
  text_vacation_manager_groups_info: "Mitglieder dieser Gruppen dürfen Abwesenheiten für alle Benutzer pflegen, z. B. Teamleitungen. Administratoren dürfen immer."
  text_vacation_hint_days_info: "Beim Zuweisen eines Tickets wird auch vor Abwesenheiten gewarnt, die innerhalb dieser Anzahl Tage beginnen. Standard: 14."
  text_vacation_block_users_info: "Keine Auswahl: alle anstehenden Abwesenheiten. Es erscheinen nur Abwesenheiten, die der jeweilige Betrachter sehen darf."

  error_vacation_no_recipients: "Bitte mindestens einen Benutzer oder eine Gruppe als Empfänger auswählen."
