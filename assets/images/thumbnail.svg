<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7fae"/>
      <stop offset="1" stop-color="#2f5b86"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="16" fill="url(#bg)"/>

  <!-- calendar sheet -->
  <rect x="17" y="24" width="60" height="58" rx="6" fill="#ffffff"/>
  <path d="M17 30 a6 6 0 0 1 6 -6 h48 a6 6 0 0 1 6 6 v8 h-60 z" fill="#d94b4b"/>
  <rect x="28" y="18" width="5" height="12" rx="2.5" fill="#e9eef4"/>
  <rect x="61" y="18" width="5" height="12" rx="2.5" fill="#e9eef4"/>

  <!-- day grid -->
  <g fill="#d5dde6">
    <rect x="23" y="44" width="8" height="7" rx="1.5"/>
    <rect x="34" y="44" width="8" height="7" rx="1.5"/>
    <rect x="45" y="44" width="8" height="7" rx="1.5"/>
    <rect x="56" y="44" width="8" height="7" rx="1.5"/>
    <rect x="67" y="44" width="5" height="7" rx="1.5"/>
    <rect x="23" y="54" width="8" height="7" rx="1.5"/>
    <rect x="67" y="54" width="5" height="7" rx="1.5"/>
    <rect x="23" y="64" width="8" height="7" rx="1.5"/>
    <rect x="34" y="64" width="8" height="7" rx="1.5"/>
    <rect x="45" y="64" width="8" height="7" rx="1.5"/>
    <rect x="56" y="64" width="8" height="7" rx="1.5"/>
    <rect x="67" y="64" width="5" height="7" rx="1.5"/>
  </g>
  <!-- the absence: a highlighted span like the banner -->
  <rect x="33" y="53" width="32" height="9" rx="3" fill="#ffd166" stroke="#e0a800" stroke-width="1"/>

  <!-- sun -->
  <g transform="translate(76 26)">
    <g stroke="#ffd166" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-17" x2="0" y2="-13"/>
      <line x1="0" y1="13" x2="0" y2="17"/>
      <line x1="-17" y1="0" x2="-13" y2="0"/>
      <line x1="13" y1="0" x2="17" y2="0"/>
      <line x1="-12" y1="-12" x2="-9.2" y2="-9.2"/>
      <line x1="9.2" y1="9.2" x2="12" y2="12"/>
      <line x1="-12" y1="12" x2="-9.2" y2="9.2"/>
      <line x1="9.2" y1="-9.2" x2="12" y2="-12"/>
    </g>
    <circle r="9.5" fill="#ffd166" stroke="#f4b400" stroke-width="1.2"/>
  </g>
</svg>
